name: CI

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '25 1 * * SUN' # every Sunday at 01:25

jobs:
  # build-in-devcontainer:
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: checkout
  #       uses: actions/checkout@v4

  #     - name: Run make ci-build in dev container
  #       uses: devcontainers/ci@v0.3
  #       with:    
  #         cacheFrom: ghcr.io/${{ github.repository }}:development
  #         push: never
  #         runCmd: cmake --workflow --preset unittest-release

  build-linux-gcc:
    strategy:
      fail-fast: false
      matrix:
        gcc: [10, 11, 12, 13, 14]
        cxx: [20, 23]

    runs-on: ubuntu-latest
  
    env:
      CC: gcc-${{ matrix.gcc }}
      CXX: g++-${{ matrix.gcc }}

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: bootstrap
        run: |
          sudo apt-get update
          sudo apt-get install clang-tidy cmake ninja-build g++-${{ matrix.gcc }} cppcheck flawfinder catch2 iwyu

      - name: Debug build & test
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=${{ matrix.cxx }} -B build/ninja-debug -S .
          cmake --build build/ninja-debug/
          ctest --test-dir build/ninja-debug/

      - name: Release build & test
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxx }} -B build/ninja-release -S .
          cmake --build build/ninja-release
          ctest --test-dir build/ninja-release/

      - name: ARM GCC bootstrap
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '15.2.Rel1'

      - name: ARM Cortex-M7 build
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=${{ matrix.cxx }} -DCMAKE_TOOLCHAIN_FILE=cmake/bob-cmake/toolchains/toolchain_cortex-m7_fpu_dp.cmake -B build/ninja-m7-debug -S .
          cmake --build build/ninja-m7-debug
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxx }} -DCMAKE_TOOLCHAIN_FILE=cmake/bob-cmake/toolchains/toolchain_cortex-m7_fpu_dp.cmake -B build/ninja-m7-release -S .
          cmake --build build/ninja-m7-release
